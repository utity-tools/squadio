# Postgres for local development and CI (ADR 0001). Credentials are synthetic and local-only.
name: squadio

services:
  db:
    image: postgres:17.11-alpine
    environment:
      # Bootstrap superuser, only for the init script: it creates the squadio_owner and squadio_app
      # roles and the squadio and squadio_test databases (ADR 0004). Neither the app nor migrations
      # use it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: postgres
    ports:
      # 5434 avoids clashing with a Postgres already installed on the host.
      - "127.0.0.1:5434:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, which the server only opens once the init script has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
