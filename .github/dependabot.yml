version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      # Minor and patch updates arrive as one PR; majors stay separate so each gets a look.
      dependencies:
        update-types: [minor, patch]
    ignore:
      # We run Node 24 (.nvmrc); its types follow the runtime, not the latest release.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Production runs Postgres 17 on Neon; a new major needs an ADR, not a bot PR.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
