name: Deploy

# Production deploys only from main, after CI passed on that exact commit (ADR 0006). Migrations
# run between the build and the deploy, as the owner role; the app role never runs them. The demo
# seed runs after them, as the app role.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# An explicit shell adds pipefail, which GitHub's default bash -e leaves out.
defaults:
  run:
    shell: bash

jobs:
  # Runs without secrets. A deploy goes ahead only for the newest commit on main, and only once CI
  # passed on it: a slow CI run on an older commit never puts older code back in production, and a
  # manual run never skips CI. After CI, the triggering event carries the result; a manual run
  # checks it through the API.
  gate:
    name: Check the commit is the tip of main and passed CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$SHA" ]; then
            echo "::notice::$SHA is no longer the tip of main ($tip); its deploy is skipped."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A workflow_run event already proves CI passed on a push of $SHA (see the job's if), so
          # only a manual run asks the API. Its run list can lag or drop runs while Actions is
          # degraded, so the query retries before failing (docs/incidents/2026-10-22-deploy-gate.md).
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            for attempt in 1 2 3 4 5; do
              passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" \
                --event push --status success --json databaseId --jq length) || passed=0
              if [ "$passed" -gt 0 ]; then
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "::error::CI has not passed on $SHA."
                exit 1
              fi
              echo "::notice::No successful CI run found for $SHA (attempt $attempt); retrying."
              sleep $((attempt * 10))
            done
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  production:
    name: Build, migrate and deploy to production
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One production deploy at a time, never cancelled halfway through a migration.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://squadio.utitytools.com
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Vercel CLI reads VERCEL_TOKEN from the environment, so it never shows in process args.
      - name: Pull production settings and variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment=production
      # Build first: a failed build leaves the database untouched.
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel build --prod
      # A string with the wrong database or role still migrates, and goes green: check where it
      # leads before writing to it (docs/incidents/2026-10-23-migrations-in-neondb.md).
      - name: Check the migration target
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: pnpm db:check-target owner
      # Migrations must keep the running version working (expand, then contract in a later deploy):
      # the old deployment serves traffic until the new one is promoted.
      - name: Apply migrations
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: pnpm db:migrate
      # The synthetic demo organization, as in previews (ADR 0009), as squadio_app. DATABASE_URL
      # comes from the variables `vercel pull` wrote, so Vercel stays the only place it is set. It
      # is masked before use and reaches the seed through the environment, never as an argument.
      # The seed replaces the demo in one transaction with fixed ids: the running deployment never
      # sees it half-written, and its links keep working.
      - name: Seed the demo organization
        run: |
          # Node's own parser: unlike @next/env, it leaves a `$` in the value alone.
          url=$(node --eval '
            const { readFileSync } = require("node:fs");
            const { parseEnv } = require("node:util");
            const pulled = parseEnv(readFileSync(".vercel/.env.production.local", "utf8"));
            process.stdout.write(pulled.DATABASE_URL ?? "");
          ')
          # Defensive: Build already fails on an empty value, as a Secret variable is pulled
          # (docs/incidents/2026-10-23-migrations-in-neondb.md).
          if [ -z "$url" ]; then echo "::error::vercel pull wrote no DATABASE_URL."; exit 1; fi
          echo "::add-mask::$url"
          # The seed's deletes rely on Row Level Security, which only binds squadio_app.
          DATABASE_URL="$url" pnpm db:check-target app
          DATABASE_URL="$url" pnpm db:seed
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel deploy --prebuilt --prod
      # A page that reads the database, through the production domain. It must answer 200 and show
      # the guide scenario's name: a scenario that is not found also answers 200, because the page
      # streams, so the status alone would miss a missing seed. Retries cover the domain moving to
      # the new deployment, which is already live by now: on failure, roll back as the runbook says.
      - name: Smoke test the guide scenario
        env:
          # DEMO_IDS.guideScenario and GUIDE_SCENARIO_NAME in src/db/demo-seed.ts.
          PAGE: https://squadio.utitytools.com/scenarios/6d656d6f-0000-4000-8000-000000000200
          EXPECTED: Plan A
        run: |
          body=$(mktemp)
          for attempt in 1 2 3 4 5; do
            status=$(curl --silent --output "$body" --write-out '%{http_code}' --max-time 20 \
              "$PAGE") || status=000
            if [ "$status" = 200 ] && grep --quiet --fixed-strings "$EXPECTED" "$body"; then
              exit 0
            fi
            echo "::notice::$PAGE answered $status without the guide scenario (attempt $attempt)."
            if [ "$attempt" -eq 5 ]; then break; fi
            sleep $((attempt * 10))
          done
          echo "::error::$PAGE never showed the guide scenario. Roll back: see docs/operations/deploy.md."
          exit 1
