name: Deploy

# Production deploys only from main, after CI passed on that exact commit (ADR 0006). Migrations
# run between the build and the deploy, as the owner role; the app role never runs them.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# An explicit shell adds pipefail, which GitHub's default bash -e leaves out.
defaults:
  run:
    shell: bash

jobs:
  # Runs without secrets. A deploy goes ahead only for the newest commit on main, and only once CI
  # passed on it: a slow CI run on an older commit never puts older code back in production, and a
  # manual run never skips CI.
  gate:
    name: Check the commit is the tip of main and passed CI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$SHA" ]; then
            echo "::notice::$SHA is no longer the tip of main ($tip); its deploy is skipped."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" \
            --event push --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on $SHA."
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  production:
    name: Build, migrate and deploy to production
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One production deploy at a time, never cancelled halfway through a migration.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://squadio.utitytools.com
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Vercel CLI reads VERCEL_TOKEN from the environment, so it never shows in process args.
      - name: Pull production settings and variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment=production
      # Build first: a failed build leaves the database untouched.
      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel build --prod
      # Migrations must keep the running version working (expand, then contract in a later deploy):
      # the old deployment serves traffic until the new one is promoted.
      - name: Apply migrations
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: pnpm db:migrate
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel deploy --prebuilt --prod
