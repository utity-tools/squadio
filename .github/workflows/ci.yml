name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Synthetic values matching .env.test; next.config.ts validates them on every build. Nothing in CI
# targets the development database.
env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DATABASE_URL: postgres://squadio_app:squadio_app_dev@127.0.0.1:5434/squadio_test

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, types, format and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test:coverage

  database:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the jobs that migrate or test get the owner role.
    env:
      DATABASE_OWNER_URL: postgres://squadio_owner:squadio_owner_dev@127.0.0.1:5434/squadio_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same Postgres and roles as local development (docker-compose.yml, ADR 0004).
      - run: docker compose up -d --wait
      # The CLI path production will use; the tests then run on top of the migrated database.
      - run: pnpm db:migrate
      - run: pnpm test:db

  e2e:
    name: E2E tests on a production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:prod
      - if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  commits:
    name: Every commit passes the checks
    # Rebase merge puts every commit on main, so each one must be green on its own. The checks job
    # already covers the last commit; the ruleset requires branches to be up to date with main.
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DATABASE_OWNER_URL: postgres://squadio_owner:squadio_owner_dev@127.0.0.1:5434/squadio_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Also catches commits made with hooks skipped or outside this machine.
      - name: Lint commit messages
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check each earlier commit
        run: |
          commits=$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA~1")
          for sha in $commits; do
            echo "::group::$(git log -1 --format='%h %s' "$sha")"
            git checkout --quiet "$sha"
            git clean -ffdxq -e node_modules
            pnpm install --frozen-lockfile --prefer-offline
            pnpm lint
            pnpm typecheck
            pnpm format:check
            pnpm test
            # A fresh database per commit, from that commit's compose file and init script.
            if jq -e '.scripts["test:db"]' package.json > /dev/null; then
              docker compose down --volumes
              docker compose up -d --wait
              pnpm test:db
            fi
            echo "::endgroup::"
          done

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependabot does not update docker:// references: bump this digest by hand.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
