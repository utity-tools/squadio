name: Clean up

# Daily, two independent jobs: one failing leaves the other alone.
# - Deletes visitors' copies of the demo idle for 30 days (ADR 0011, "Clean-up"), with the code on
#   main, as the owner role: the only one that reads visitor_copies directly.
# - Reseeds the demo template, with the code production last deployed, as squadio_app, so its
#   ongoing scenarios follow today (docs/domain.md, "The demo's dates"; ADR 0006).
on:
  schedule:
    # Off the hour, when GitHub's scheduled runs queue the most.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# An explicit shell adds pipefail, which GitHub's default bash -e leaves out.
defaults:
  run:
    shell: bash

jobs:
  visitor-copies:
    name: Delete idle visitor copies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own group: sharing deploy-production would let a queued clean-up replace a queued deploy.
    # A clean-up that meets a migration waits on its locks.
    concurrency:
      group: clean-up-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # As before migrations: a string with the wrong database or role must fail before it deletes
      # anything (docs/incidents/2026-10-23-migrations-in-neondb.md).
      - name: Check the target
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: pnpm db:check-target owner
      - name: Delete idle visitor copies
        env:
          DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: pnpm db:clean-up

  # Runs without secrets. The reseed runs the seed of the commit production last deployed, not
  # main's tip: main can be ahead of production's schema until its deploy migrates, or for days
  # when a deploy fails. While a deploy is queued or running, the reseed is skipped: that deploy
  # seeds anyway, and a queued reseed could replace it in the concurrency group.
  demo-gate:
    name: Find the commit production runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      reseed: ${{ steps.find.outputs.reseed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          # The job of deploy.yml that migrates, seeds and promotes.
          DEPLOY_JOB: Build, migrate and deploy to production
        run: |
          busy=0
          for status in queued in_progress waiting pending requested; do
            count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Deploy --status "$status" \
              --json databaseId --jq length)
            busy=$((busy + count))
          done
          if [ "$busy" -gt 0 ]; then
            echo "::notice::A deploy is queued or running, and it seeds the demo; reseed skipped."
            echo "reseed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A Deploy run whose gate skipped deploying still succeeds: check the deploy job itself.
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow Deploy --branch main \
            --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            sha=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha,jobs --jq \
              'select(any(.jobs[]; .name == env.DEPLOY_JOB and .conclusion == "success")) | .headSha')
            if [ -n "$sha" ]; then
              echo "::notice::Production last deployed $sha (Deploy run $run)."
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "reseed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No successful production deploy among the last 20 Deploy runs: check Deploy."
          exit 1

  demo:
    name: Reseed the demo template
    needs: demo-gate
    if: needs.demo-gate.outputs.reseed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The deploy's group, so a deploy that starts after the gate waits for the reseed, or the other
    # way round. A group keeps one pending run: a deploy queued in the seconds after the gate can
    # still replace this reseed, or be replaced by it, and then shows as cancelled
    # (docs/operations/deploy.md).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      # Once this job holds the group, a deploy that ran after the gate has seeded already, with
      # newer code: then the reseed gives way.
      - id: recheck
        name: Check production still runs the gate's commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_JOB: Build, migrate and deploy to production
          SHA: ${{ needs.demo-gate.outputs.sha }}
        run: |
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow Deploy --branch main \
            --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            sha=$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json headSha,jobs --jq \
              'select(any(.jobs[]; .name == env.DEPLOY_JOB and .conclusion == "success")) | .headSha')
            if [ -n "$sha" ]; then break; fi
          done
          if [ "${sha:-}" != "$SHA" ]; then
            echo "::notice::Production now runs ${sha:-an unknown commit}, deployed after the gate; reseed skipped."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.recheck.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.demo-gate.outputs.sha }}
          persist-credentials: false
      - if: steps.recheck.outputs.current == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.recheck.outputs.current == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.recheck.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
      # The Vercel CLI reads VERCEL_TOKEN from the environment, so it never shows in process args.
      - name: Pull production settings and variables
        if: steps.recheck.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm exec vercel pull --yes --environment=production
      - name: Seed the demo organization
        if: steps.recheck.outputs.current == 'true'
        uses: ./.github/actions/seed-demo
      - name: Smoke test the guide scenario
        if: steps.recheck.outputs.current == 'true'
        uses: ./.github/actions/smoke-test
        with:
          failure-hint: "The seed failed or left no guide scenario: see docs/operations/deploy.md."
